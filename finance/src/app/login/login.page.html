<ion-content [fullscreen]="true" class="login-content">
  <div class="login-container">
    <ion-card class="login-card">
      <ion-card-content>
        <ion-text class="brand-name"><ion-text>Finance</ion-text><ion-text class="brand-accent">Tracker</ion-text></ion-text>
        <div class="login-heading">
          <h1>Welcome back!</h1>
          <p>Log in to manage your finances and stay on top of your goals.</p>
        </div>
        <ion-list lines="none" class="login-form">
          <ion-label for="email">Email address</ion-label>
          <ion-item class="input-wrap" [class.invalid]="formSubmitted && !isEmailValid">
            <ion-icon name="mail-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              id="email"
              name="email"
              type="email"
              placeholder="you@gmail.com"
              autocomplete="email"
              [(ngModel)]="email"
              (ionInput)="errorMessage = ''"
            ></ion-input>
          </ion-item>
          <ion-text class="field-error" *ngIf="formSubmitted && !isEmailValid">Enter a valid email address.</ion-text>

          <ion-text class="password-label"
            ><ion-label for="password">Password</ion-label
            ><ion-button fill="clear" size="small" href="#forgot-password" (click)="$event.preventDefault()"
              >Forgot password?</ion-button
            ></ion-text
          >
          <ion-item class="input-wrap" [class.invalid]="formSubmitted && !isPasswordValid">
            <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              autocomplete="current-password"
              [(ngModel)]="password"
              (ionInput)="errorMessage = ''"
            ></ion-input>
            <ion-button
              slot="end"
              fill="clear"
              class="show-password"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              (click)="showPassword = !showPassword"
              ><ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon
            ></ion-button>
          </ion-item>
          <ion-text class="field-error" *ngIf="formSubmitted && !isPasswordValid"
            >Password must contain at least 6 characters.</ion-text
          >

          <ion-item class="remember"
            ><ion-checkbox slot="start" name="rememberMe" [(ngModel)]="rememberMe"></ion-checkbox
            ><ion-label>Remember me</ion-label></ion-item
          >
          <ion-button expand="block" class="sign-in" [disabled]="isSubmitting" (click)="signIn()">
            <ion-text *ngIf="!isSubmitting">Sign in <ion-icon name="arrow-forward-outline"></ion-icon></ion-text>
            <ion-text *ngIf="isSubmitting" class="button-loading"><ion-text></ion-text>Signing in...</ion-text>
          </ion-button>
        </ion-list>
        <ion-text class="register"
          >Don&rsquo;t have an account?
          <ion-button fill="clear" size="small" href="#register" (click)="$event.preventDefault()"
            >Create account</ion-button
          ></ion-text
        >
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
